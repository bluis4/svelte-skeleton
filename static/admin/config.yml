local_backend: true

backend:
  name: github
  repo: bluis4/svelte-skeleton
  branch: main

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  # ── Global site settings (one fixed file) ─────────────────
  - name: "settings"
    label: "Settings"
    files:
      - name: "site"
        label: "Site Settings"
        file: "src/content/settings/site.json"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string" }
          - { label: "Brand Highlight", name: "brand_highlight", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string", required: false }
          - { label: "Header CTA Text", name: "cta_text", widget: "string", required: false }
          - { label: "Header CTA Link", name: "cta_link", widget: "string", required: false }
          - label: "Theme Preset"
            name: "theme_preset"
            widget: "select"
            options: ["default", "hotel", "spa"]
            default: "default"
          - label: "Color Palette"
            name: "color_palette"
            widget: "select"
            options: ["light", "dark", "emerald", "luxury", "pastel"]
            default: "dark"
          - label: "Blog Pagination"
            name: "blog_pagination"
            widget: "select"
            options: ["numbered", "infinite"]
            default: "infinite"
          - { label: "Posts Per Page", name: "posts_per_page", widget: "number", default: 10 }

  # ── Modular pages (the page-builder contract) ─────────────
  - name: "pages"
    label: "Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Show in Navigation", name: "show_in_menu", widget: "boolean", default: true }
      - { label: "Menu Order", name: "menu_order", widget: "number", default: 2 }
      - label: "Page Sections"
        name: "sections"
        widget: "list"
        types:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "CTA Text", name: "cta_text", widget: "string", required: false }
              - { label: "CTA Link", name: "cta_link", widget: "string", required: false }

          - label: "Intro"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - label: "Layout"
                name: "layout"
                widget: "object"
                typeKey: "mode"
                default: { mode: "flex", direction: "row" }
                types:
                  - label: "Flexbox"
                    name: "flex"
                    fields:
                      - label: "Desktop direction"
                        name: "direction"
                        widget: "select"
                        options:
                          - { label: "Text then image", value: "row" }
                          - { label: "Image then text", value: "row-reverse" }
                          - { label: "Stack vertically", value: "column" }
                        default: "row"
                      - label: "Gap"
                        name: "gap"
                        widget: "number"
                        value_type: "float"
                        min: 0
                        max: 12
                        step: 0.25
                        default: 2.5
                        after_input: "rem"
                  - label: "Grid"
                    name: "grid"
                    fields:
                      - label: "Columns"
                        name: "columns"
                        widget: "number"
                        min: 1
                        max: 4
                        default: 2
                      - label: "Rows"
                        name: "rows"
                        widget: "number"
                        min: 1
                        max: 4
                        default: 1
                      - label: "Gap"
                        name: "gap"
                        widget: "number"
                        value_type: "float"
                        min: 0
                        max: 12
                        step: 0.25
                        default: 2.5
                        after_input: "rem"
                      - label: "Text column"
                        name: "content_column"
                        widget: "number"
                        min: 1
                        max: 4
                        default: 1
                      - label: "Text row"
                        name: "content_row"
                        widget: "number"
                        min: 1
                        max: 4
                        default: 1
                      - label: "Image column"
                        name: "image_column"
                        widget: "number"
                        min: 1
                        max: 4
                        default: 2
                      - label: "Image row"
                        name: "image_row"
                        widget: "number"
                        min: 1
                        max: 4
                        default: 1

          - label: "Cards Grid"
            name: "cards"
            widget: "object"
            fields:
              - { label: "Grid Title", name: "title", widget: "string", required: false }
              - label: "Cards"
                name: "children"
                widget: "list"
                types:
                  - label: "Card"
                    name: "card"
                    widget: "object"
                    fields:
                      - { label: "Card Title", name: "title", widget: "string" }
                      - { label: "Image", name: "image", widget: "image", required: false }
                      - label: "Inner Blocks"
                        name: "children"
                        widget: "list"
                        types:
                          - label: "Text"
                            name: "text"
                            widget: "object"
                            fields:
                              - { label: "Content", name: "content", widget: "text" }
                          - label: "Badge"
                            name: "badge"
                            widget: "object"
                            fields:
                              - { label: "Text", name: "text", widget: "string" }
                              - label: "Style"
                                name: "style"
                                widget: "select"
                                options: ["primary", "secondary", "accent"]
                                default: "primary"
                                required: false
                          - label: "Button"
                            name: "button"
                            widget: "object"
                            fields:
                              - { label: "Text", name: "text", widget: "string" }
                              - { label: "Link", name: "link", widget: "string", required: false }
                              - label: "Variant"
                                name: "variant"
                                widget: "select"
                                options: ["primary", "secondary", "accent", "info", "success", "warning", "error", "neutral", "ghost"]
                                default: "primary"
                              - label: "Size"
                                name: "size"
                                widget: "select"
                                options: ["xs", "sm", "md", "lg"]
                                default: "md"
                              - label: "Modifiers"
                                name: "modifiers"
                                widget: "select"
                                multiple: true
                                options: ["outline", "link", "wide", "block"]
                                required: false
                              - label: "Shape"
                                name: "shape"
                                widget: "select"
                                options: ["default", "circle", "square"]
                                default: "default"
                              - { label: "Disabled", name: "disabled", widget: "boolean", default: false, required: false }
                              - { label: "Render as <button> tag", name: "is_button", widget: "boolean", default: false, required: false }
                          - label: "Image"
                            name: "image"
                            widget: "object"
                            fields:
                              - { label: "Image", name: "src", widget: "image" }
                              - { label: "Alt Text", name: "alt", widget: "string", required: false }

          - label: "CTA Banner"
            name: "cta_banner"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "Button Text", name: "button_text", widget: "string" }
              - { label: "Button Link", name: "button_link", widget: "string" }

          - label: "Button"
            name: "button"
            widget: "object"
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Link", name: "link", widget: "string", required: false }
              - label: "Variant"
                name: "variant"
                widget: "select"
                options: ["primary", "secondary", "accent", "info", "success", "warning", "error", "neutral", "ghost"]
                default: "primary"
              - label: "Size"
                name: "size"
                widget: "select"
                options: ["xs", "sm", "md", "lg"]
                default: "md"
              - label: "Modifiers"
                name: "modifiers"
                widget: "select"
                multiple: true
                options: ["outline", "link", "wide", "block"]
                required: false
              - label: "Shape"
                name: "shape"
                widget: "select"
                options: ["default", "circle", "square"]
                default: "default"
              - { label: "Disabled", name: "disabled", widget: "boolean", default: false, required: false }
              - { label: "Render as <button> tag", name: "is_button", widget: "boolean", default: false, required: false }

          - label: "Dropdown"
            name: "dropdown"
            widget: "object"
            fields:
              - { label: "Trigger label", name: "label", widget: "string" }
              - label: "Position"
                name: "position"
                widget: "select"
                options: ["start", "center", "end"]
                default: "end"
              - label: "Menu Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "href", widget: "string", required: false }

          - label: "FAB / Speed Dial"
            name: "fab"
            widget: "object"
            fields:
              - { label: "Accessible label", name: "label", widget: "string" }
              - { label: "Trigger text", name: "trigger", widget: "string", default: "IT" }
              - label: "Actions"
                name: "actions"
                widget: "list"
                fields:
                  - { label: "Action label", name: "label", widget: "string" }
                  - { label: "Button text", name: "text", widget: "string" }
                  - { label: "Link", name: "href", widget: "string", required: false }

          - label: "Modal"
            name: "modal"
            widget: "object"
            fields:
              - { label: "Trigger", name: "trigger", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Content", name: "content", widget: "text" }
              - { label: "Close button label", name: "close_label", widget: "string", default: "Close" }

          - label: "Swap"
            name: "swap"
            widget: "object"
            fields:
              - { label: "Text when active", name: "on_text", widget: "string" }
              - { label: "Text when inactive", name: "off_text", widget: "string" }
              - { label: "Accessible label", name: "accessible_label", widget: "string" }
              - label: "Animation"
                name: "style"
                widget: "select"
                options: ["none", "rotate", "flip"]
                default: "rotate"

          - label: "Theme Controller"
            name: "theme_controller"
            widget: "object"
            fields:
              - { label: "Legend", name: "label", widget: "string" }
              - label: "Theme Options"
                name: "options"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - label: "Theme value"
                    name: "value"
                    widget: "select"
                    options: ["light", "dark", "luxury", "emerald", "pastel"]

          - label: "Alert"
            name: "alert"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Text", name: "text", widget: "text" }
              - label: "Variant"
                name: "variant"
                widget: "select"
                options: ["info", "success", "warning", "error"]
                default: "info"
              - { label: "Show Icon", name: "icon", widget: "boolean", default: true, required: false }

          - label: "Loading"
            name: "loading"
            widget: "object"
            fields:
              - label: "Loading style"
                name: "variant"
                widget: "select"
                options: ["spinner", "dots", "ring", "ball", "bars", "infinity"]
                default: "spinner"
              - label: "Size"
                name: "size"
                widget: "select"
                options: ["xs", "sm", "md", "lg", "xl"]
                default: "md"
              - { label: "Accessible label", name: "label", widget: "string", default: "Loading", required: false }
              - { label: "Status text", name: "text", widget: "string", required: false }

          - label: "Progress"
            name: "progress"
            widget: "object"
            fields:
              - { label: "Value (0-100)", name: "value", widget: "number", value_type: "int", min: 0, max: 100, default: 0 }
              - { label: "Label", name: "label", widget: "string", required: false }
              - label: "Color"
                name: "color"
                widget: "select"
                options: ["neutral", "primary", "secondary", "accent", "info", "success", "warning", "error"]
                default: "primary"
              - { label: "Show percentage", name: "show_value", widget: "boolean", default: true, required: false }

          - label: "Radial Progress"
            name: "radial_progress"
            widget: "object"
            fields:
              - { label: "Value (0-100)", name: "value", widget: "number", value_type: "int", min: 0, max: 100, default: 0 }
              - { label: "Label", name: "label", widget: "string", required: false }
              - { label: "Size (CSS length)", name: "size", widget: "string", default: "6rem", required: false }
              - { label: "Thickness (CSS length)", name: "thickness", widget: "string", default: "0.5rem", required: false }
              - label: "Color"
                name: "color"
                widget: "select"
                options: ["neutral", "primary", "secondary", "accent", "info", "success", "warning", "error"]
                default: "primary"

          - label: "Skeleton"
            name: "skeleton"
            widget: "object"
            fields:
              - label: "Placeholder style"
                name: "variant"
                widget: "select"
                options: ["card", "avatar", "text"]
                default: "card"
              - { label: "Accessible label", name: "label", widget: "string", default: "Loading content", required: false }

          - label: "Toast"
            name: "toast"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Message", name: "text", widget: "text" }
              - label: "Variant"
                name: "variant"
                widget: "select"
                options: ["info", "success", "warning", "error"]
                default: "info"
              - label: "Placement"
                name: "placement"
                widget: "select"
                options: ["top-start", "top-center", "top-end", "middle-start", "middle-center", "middle-end", "bottom-start", "bottom-center", "bottom-end"]
                default: "bottom-end"

          - label: "Tooltip"
            name: "tooltip"
            widget: "object"
            fields:
              - { label: "Tooltip text", name: "tip", widget: "string" }
              - { label: "Trigger label", name: "label", widget: "string", required: false }
              - label: "Placement"
                name: "placement"
                widget: "select"
                options: ["top", "bottom", "left", "right"]
                default: "top"
              - label: "Color"
                name: "color"
                widget: "select"
                options: ["default", "primary", "secondary", "accent", "info", "success", "warning", "error"]
                default: "default"

          - label: "Docs Layout"
            name: "docs_layout"
            widget: "object"
            fields:
              - label: "Sidebar Categories"
                name: "sidebar"
                widget: "list"
                fields:
                  - { label: "Category", name: "label", widget: "string" }
                  - { label: "Anchor", name: "anchor", widget: "string" }
                  - label: "Component Links"
                    name: "links"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Component", name: "label", widget: "string" }
                      - { label: "Anchor", name: "anchor", widget: "string" }
              - label: "Child Blocks"
                name: "children"
                widget: "list"
                types:
                  - label: "Heading"
                    name: "heading"
                    widget: "object"
                    fields:
                      - { label: "Heading", name: "title", widget: "string" }
                      - { label: "Anchor", name: "anchor", widget: "string" }
                  - label: "Divider"
                    name: "divider"
                    widget: "object"
                    fields: []
                  - label: "Text"
                    name: "text"
                    widget: "object"
                    fields:
                      - { label: "Content", name: "content", widget: "text" }
                  - label: "Button"
                    name: "button"
                    widget: "object"
                    fields:
                      - { label: "Text", name: "text", widget: "string" }
                      - { label: "Link", name: "link", widget: "string", required: false }
                      - label: "Variant"
                        name: "variant"
                        widget: "select"
                        options: ["primary", "secondary", "accent", "info", "success", "warning", "error", "neutral", "ghost"]
                        default: "primary"
                      - label: "Size"
                        name: "size"
                        widget: "select"
                        options: ["xs", "sm", "md", "lg"]
                        default: "md"
                      - label: "Modifiers"
                        name: "modifiers"
                        widget: "select"
                        multiple: true
                        options: ["outline", "link", "wide", "block"]
                        required: false
                      - label: "Shape"
                        name: "shape"
                        widget: "select"
                        options: ["default", "circle", "square"]
                        default: "default"
                      - { label: "Disabled", name: "disabled", widget: "boolean", default: false, required: false }
                      - { label: "Render as <button> tag", name: "is_button", widget: "boolean", default: false, required: false }
                  - label: "Dropdown"
                    name: "dropdown"
                    widget: "object"
                    fields:
                      - { label: "Trigger label", name: "label", widget: "string" }
                      - label: "Position"
                        name: "position"
                        widget: "select"
                        options: ["start", "center", "end"]
                        default: "end"
                      - label: "Menu Items"
                        name: "items"
                        widget: "list"
                        fields:
                          - { label: "Label", name: "label", widget: "string" }
                          - { label: "Link", name: "href", widget: "string", required: false }
                  - label: "FAB / Speed Dial"
                    name: "fab"
                    widget: "object"
                    fields:
                      - { label: "Accessible label", name: "label", widget: "string" }
                      - { label: "Trigger text", name: "trigger", widget: "string", default: "IT" }
                      - label: "Actions"
                        name: "actions"
                        widget: "list"
                        fields:
                          - { label: "Action label", name: "label", widget: "string" }
                          - { label: "Button text", name: "text", widget: "string" }
                          - { label: "Link", name: "href", widget: "string", required: false }
                  - label: "Modal"
                    name: "modal"
                    widget: "object"
                    fields:
                      - { label: "Trigger", name: "trigger", widget: "string" }
                      - { label: "Title", name: "title", widget: "string" }
                      - { label: "Content", name: "content", widget: "text" }
                      - { label: "Close button label", name: "close_label", widget: "string", default: "Close" }
                  - label: "Swap"
                    name: "swap"
                    widget: "object"
                    fields:
                      - { label: "Text when active", name: "on_text", widget: "string" }
                      - { label: "Text when inactive", name: "off_text", widget: "string" }
                      - { label: "Accessible label", name: "accessible_label", widget: "string" }
                      - label: "Animation"
                        name: "style"
                        widget: "select"
                        options: ["none", "rotate", "flip"]
                        default: "rotate"
                  - label: "Theme Controller"
                    name: "theme_controller"
                    widget: "object"
                    fields:
                      - { label: "Legend", name: "label", widget: "string" }
                      - label: "Theme Options"
                        name: "options"
                        widget: "list"
                        fields:
                          - { label: "Label", name: "label", widget: "string" }
                          - label: "Theme value"
                            name: "value"
                            widget: "select"
                            options: ["light", "dark", "luxury", "emerald", "pastel"]
                  - label: "Alert"
                    name: "alert"
                    widget: "object"
                    fields:
                      - { label: "Title", name: "title", widget: "string", required: false }
                      - { label: "Text", name: "text", widget: "text" }
                      - label: "Variant"
                        name: "variant"
                        widget: "select"
                        options: ["info", "success", "warning", "error"]
                        default: "info"
                      - { label: "Show Icon", name: "icon", widget: "boolean", default: true, required: false }
                  - label: "Loading"
                    name: "loading"
                    widget: "object"
                    fields:
                      - label: "Loading style"
                        name: "variant"
                        widget: "select"
                        options: ["spinner", "dots", "ring", "ball", "bars", "infinity"]
                        default: "spinner"
                      - label: "Size"
                        name: "size"
                        widget: "select"
                        options: ["xs", "sm", "md", "lg", "xl"]
                        default: "md"
                      - { label: "Accessible label", name: "label", widget: "string", default: "Loading", required: false }
                      - { label: "Status text", name: "text", widget: "string", required: false }
                  - label: "Progress"
                    name: "progress"
                    widget: "object"
                    fields:
                      - { label: "Value (0-100)", name: "value", widget: "number", value_type: "int", min: 0, max: 100, default: 0 }
                      - { label: "Label", name: "label", widget: "string", required: false }
                      - label: "Color"
                        name: "color"
                        widget: "select"
                        options: ["neutral", "primary", "secondary", "accent", "info", "success", "warning", "error"]
                        default: "primary"
                      - { label: "Show percentage", name: "show_value", widget: "boolean", default: true, required: false }
                  - label: "Radial Progress"
                    name: "radial_progress"
                    widget: "object"
                    fields:
                      - { label: "Value (0-100)", name: "value", widget: "number", value_type: "int", min: 0, max: 100, default: 0 }
                      - { label: "Label", name: "label", widget: "string", required: false }
                      - { label: "Size (CSS length)", name: "size", widget: "string", default: "6rem", required: false }
                      - { label: "Thickness (CSS length)", name: "thickness", widget: "string", default: "0.5rem", required: false }
                      - label: "Color"
                        name: "color"
                        widget: "select"
                        options: ["neutral", "primary", "secondary", "accent", "info", "success", "warning", "error"]
                        default: "primary"
                  - label: "Skeleton"
                    name: "skeleton"
                    widget: "object"
                    fields:
                      - label: "Placeholder style"
                        name: "variant"
                        widget: "select"
                        options: ["card", "avatar", "text"]
                        default: "card"
                      - { label: "Accessible label", name: "label", widget: "string", default: "Loading content", required: false }
                  - label: "Toast"
                    name: "toast"
                    widget: "object"
                    fields:
                      - { label: "Title", name: "title", widget: "string", required: false }
                      - { label: "Message", name: "text", widget: "text" }
                      - label: "Variant"
                        name: "variant"
                        widget: "select"
                        options: ["info", "success", "warning", "error"]
                        default: "info"
                      - label: "Placement"
                        name: "placement"
                        widget: "select"
                        options: ["top-start", "top-center", "top-end", "middle-start", "middle-center", "middle-end", "bottom-start", "bottom-center", "bottom-end"]
                        default: "bottom-end"
                  - label: "Tooltip"
                    name: "tooltip"
                    widget: "object"
                    fields:
                      - { label: "Tooltip text", name: "tip", widget: "string" }
                      - { label: "Trigger label", name: "label", widget: "string", required: false }
                      - label: "Placement"
                        name: "placement"
                        widget: "select"
                        options: ["top", "bottom", "left", "right"]
                        default: "top"
                      - label: "Color"
                        name: "color"
                        widget: "select"
                        options: ["default", "primary", "secondary", "accent", "info", "success", "warning", "error"]
                        default: "default"
                  - label: Hero
                    name: hero
                    widget: object
                    fields:
                      - label: Badge
                        name: badge
                        widget: string
                        required: false
                      - label: Title
                        name: title
                        widget: string
                        required: true
                      - label: Description
                        name: description
                        widget: text
                      - label: CTA Text
                        name: cta_text
                        widget: string
                        required: false
                      - label: CTA Link
                        name: cta_link
                        widget: string
                        required: false
                  - label: Calendar
                    name: calendar
                    widget: object
                    fields:
                      - label: Label
                        name: label
                        widget: string
                        required: true
                      - label: Date
                        name: value
                        widget: datetime
                        format: YYYY-MM-DD
                        date_format: YYYY-MM-DD
                        time_format: false
                        required: false
                      - label: Field name
                        name: name
                        widget: string
                        required: false
                  - label: Checkbox
                    name: checkbox
                    widget: object
                    fields:
                      - label: Label
                        name: label
                        widget: string
                        required: true
                      - label: Checked
                        name: checked
                        widget: boolean
                        default: false
                        required: false
